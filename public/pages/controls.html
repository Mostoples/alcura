<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <link rel="shortcut icon" href="../favicon.svg" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Controls — ALCURA</title>
  <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=5">
  <link rel="stylesheet" href="../css/mobile.css?v=5">
  <link rel="stylesheet" href="../css/landing.css?v=5">
</head>
<body>
<div class="liquid-bg">
  <div class="flow flow-a" aria-hidden="true"></div>
  <div class="flow flow-b" aria-hidden="true"></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="culture-cells" aria-hidden="true"></div>
</div>
<div class="app-container">
  <header class="top-bar">
    <div class="page-title-block"><h2>Controls</h2><p>Atur LED, aerasi & mode</p></div>
    <div class="top-bar-actions">
      <div class="theme-toggle" onclick="toggleTheme()" title="Ganti tema" role="button" tabindex="0"><div class="knob"></div><span class="tt sun"><i class="ph-fill ph-sun"></i></span><span class="tt moon"><i class="ph-fill ph-moon"></i></span></div>
    </div>
  </header>

  <div class="app-scroll">
    <div class="checkbox" style="border:0"><input type="checkbox" id="autoMode" checked><label for="autoMode"><b>Auto Mode (AI Optimized)</b> — Sistem menyesuaikan parameter otomatis dari data sensor.</label></div>

    <div class="auto-banner on" id="autoBanner"><i class="ph-fill ph-robot"></i><div><b id="autoState">AI Auto Mode aktif</b><ul class="rec-list" id="autoRecs" style="margin-top:.4rem"></ul></div></div>

    <h3 class="section-title">LED & Environment</h3>
    <div class="slider-group">
      <label><span>LED Intensity</span><span id="ledVal">72%</span></label>
      <input type="range" min="0" max="100" value="72" id="ledSlider" oninput="onSlider('ledIntensity', this)">
    </div>

    <h3 class="section-title">Spectrum Tuning</h3>
    <div class="spectrum-grid">
      <div class="spectrum-item"><label>Red</label><div class="spectrum-swatch" style="background:#ff4444"></div><input type="range" min="0" max="100" value="85" data-spec="red" oninput="onSpectrum(this)"></div>
      <div class="spectrum-item"><label>Blue</label><div class="spectrum-swatch" style="background:#4488ff"></div><input type="range" min="0" max="100" value="60" data-spec="blue" oninput="onSpectrum(this)"></div>
      <div class="spectrum-item"><label>Green</label><div class="spectrum-swatch" style="background:#44ff44"></div><input type="range" min="0" max="100" value="45" data-spec="green" oninput="onSpectrum(this)"></div>
      <div class="spectrum-item"><label>Far-Red</label><div class="spectrum-swatch" style="background:#cc3333"></div><input type="range" min="0" max="100" value="30" data-spec="farRed" oninput="onSpectrum(this)"></div>
      <div class="spectrum-item"><label>UV</label><div class="spectrum-swatch" style="background:#9944ff"></div><input type="range" min="0" max="100" value="15" data-spec="uv" oninput="onSpectrum(this)"></div>
    </div>

    <div class="slider-group">
      <label><span>Aeration Rate</span><span id="aerVal">60%</span></label>
      <input type="range" min="0" max="100" value="60" id="aerSlider" oninput="onSlider('aeration', this)">
    </div>

    <h3 class="section-title">Advanced Settings</h3>
    <div class="card no-pattern aura-green">
      <div class="checkbox" style="border:0;padding:.4rem 0"><input type="checkbox" id="co2" checked onchange="onCo2(this)"><label for="co2">CO₂ Injection</label></div>
      <div style="background:rgba(var(--aura-green),.10);border-radius:var(--radius);padding:.8rem;margin-top:.4rem;font-size:.8rem"><span style="color:var(--text-muted)">Status: <b style="color:var(--accent)" id="co2Status">Aktif</b></span></div>
    </div>

    <h3 class="section-title">Mode Preset</h3>
    <div class="btn-group">
      <button class="btn btn-secondary" data-mode="siang" onclick="setMode('siang', this)"><i class="ph-fill ph-sun"></i> Siang</button>
      <button class="btn btn-secondary" data-mode="malam" onclick="setMode('malam', this)"><i class="ph-fill ph-moon-stars"></i> Malam</button>
      <button class="btn btn-primary" data-mode="growth" onclick="setMode('growth', this)"><i class="ph-fill ph-rocket"></i> Growth</button>
    </div>

    <button class="btn btn-primary btn-block" onclick="saveSettings()"><i class="ph ph-floppy-disk"></i> Simpan Pengaturan</button>
  </div>

  <div class="spacer-bottom"></div>
  <nav class="bottom-nav">
    <a href="../app.html" class="nav-item"><i class="ph ph-house" data-icon="ph-house"></i><span>Home</span></a>
    <a href="air-quality.html" class="nav-item"><i class="ph ph-wind" data-icon="ph-wind"></i><span>Air</span></a>
    <a href="culture-health.html" class="nav-item fab" aria-label="Culture"><i class="ph-fill ph-plant"></i></a>
    <a href="alerts.html" class="nav-item"><i class="ph ph-bell" data-icon="ph-bell"></i><span>Alerts</span></a>
    <a href="settings.html" class="nav-item"><i class="ph ph-gear" data-icon="ph-gear"></i><span>More</span></a>
  </nav>
</div>

<script src="../js/app-shell.js"></script>
<script src="../js/more-menu.js"></script>
<script src="../js/i18n.js?v=5"></script>
<script src="../js/sensors-engine.js"></script>
<script>
requireAuthPage();

var ledSlider = document.getElementById('ledSlider');
var aerSlider = document.getElementById('aerSlider');
var autoChk = document.getElementById('autoMode');
var co2Chk = document.getElementById('co2');

// --- Initialise inputs from saved control state ---
(function initFromControl() {
  var c = ALCURA.control;
  autoChk.checked = !!c.autoMode;
  co2Chk.checked = !!c.co2Injection;
  document.querySelectorAll('[data-spec]').forEach(function (s) {
    var k = s.getAttribute('data-spec'); if (c.spectrum[k] != null) s.value = c.spectrum[k];
  });
  document.querySelectorAll('.btn-group .btn').forEach(function (b) {
    var on = b.getAttribute('data-mode') === c.mode;
    b.classList.toggle('btn-primary', on); b.classList.toggle('btn-secondary', !on);
  });
})();

function T(en, id, ja) { var l = (window.ALCURA_I18N && ALCURA_I18N.lang) || 'en'; return l === 'id' ? id : (l === 'ja' ? ja : en); }
autoChk.addEventListener('change', function () {
  ALCURA.setControl('autoMode', autoChk.checked);
  toast(autoChk.checked ? T('AI Auto Mode on', 'AI Auto Mode diaktifkan', 'AIオートモード オン') : T('Manual mode on', 'Mode manual diaktifkan', '手動モード オン'));
});

function onSlider(key, el) {
  document.getElementById(key === 'ledIntensity' ? 'ledVal' : 'aerVal').textContent = el.value + '%';
  if (!autoChk.checked) ALCURA.setControl(key, +el.value);
}
function onSpectrum(el) {
  var obj = {}; obj[el.getAttribute('data-spec')] = +el.value;
  ALCURA.setControl('spectrum', obj);
}
function onCo2(el) {
  ALCURA.setControl('co2Injection', el.checked);
  document.getElementById('co2Status').textContent = el.checked ? T('Active', 'Aktif', '有効') : T('Inactive', 'Nonaktif', '無効');
}
function setMode(mode, el) {
  ALCURA.setControl('mode', mode);
  document.querySelectorAll('.btn-group .btn').forEach(b => { b.classList.add('btn-secondary'); b.classList.remove('btn-primary'); });
  if (el) { el.classList.add('btn-primary'); el.classList.remove('btn-secondary'); }
  var mn = mode === 'siang' ? T('Day', 'Siang', '昼') : mode === 'malam' ? T('Night', 'Malam', '夜') : T('Growth', 'Growth', 'グロース');
  toast(T('Mode changed to: ', 'Mode diubah ke: ', 'モード変更: ') + mn);
}
function saveSettings() { toast(T('Settings saved ✓', 'Pengaturan tersimpan ✓', '設定を保存しました ✓')); }

// --- Reflect engine state: when Auto Mode is on, sliders mirror the AI setpoints ---
ALCURA.on(function (d) {
  var auto = autoChk.checked;
  // Lock manual sliders while AI drives them
  ledSlider.disabled = auto; aerSlider.disabled = auto;
  ledSlider.style.opacity = auto ? '.6' : '1'; aerSlider.style.opacity = auto ? '.6' : '1';

  ledSlider.value = d.applied.ledIntensity;
  aerSlider.value = d.applied.aeration;
  document.getElementById('ledVal').textContent = d.applied.ledIntensity + '%';
  document.getElementById('aerVal').textContent = d.applied.aeration + '%';
  if (auto) { co2Chk.checked = d.applied.co2Injection; document.getElementById('co2Status').textContent = d.applied.co2Injection ? T('Active', 'Aktif', '有効') : T('Inactive', 'Nonaktif', '無効'); }

  var banner = document.getElementById('autoBanner');
  banner.classList.toggle('on', auto);
  document.getElementById('autoState').textContent = auto ? T('AI Auto Mode active — latest decisions:', 'AI Auto Mode aktif — keputusan terkini:', 'AIオートモード有効 — 最新の判断:') : T('Manual mode — Auto Mode off', 'Mode manual — Auto Mode nonaktif', '手動モード — オートモード オフ');
  document.getElementById('autoRecs').innerHTML = auto
    ? d.auto.recommendations.map(function (r) { return '<li><i class="ph-fill ph-caret-right"></i><span>' + r + '</span></li>'; }).join('')
    : '<li><i class="ph-fill ph-hand"></i><span>' + T('Turn on Auto Mode so the system manages LED, aeration & CO₂ automatically.', 'Aktifkan Auto Mode agar sistem mengatur LED, aerasi & CO₂ otomatis.', 'オートモードを有効にすると、LED・エアレーション・CO₂を自動管理します。') + '</span></li>';
});
</script>
</body>
</html>
