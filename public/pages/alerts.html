<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <link rel="shortcut icon" href="../img/logo.png" type="image/png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Alerts — ALCURA</title>
  <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=16">
  <link rel="stylesheet" href="../css/mobile.css?v=16">
  <link rel="stylesheet" href="../css/landing.css?v=16">
</head>
<body>
<div class="liquid-bg">
  <div class="flow flow-a" aria-hidden="true"></div>
  <div class="flow flow-b" aria-hidden="true"></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="culture-cells" aria-hidden="true"></div>
</div>
<div class="app-container calm">
  <header class="top-bar">
    <div class="page-title-block"><h2>Alerts</h2><p>Notifikasi & peringatan sistem</p></div>
    <div class="top-bar-actions">
      <div class="theme-toggle" onclick="toggleTheme()" title="Ganti tema" role="button" tabindex="0"><div class="knob"></div><span class="tt sun"><i class="ph-fill ph-sun"></i></span><span class="tt moon"><i class="ph-fill ph-moon"></i></span></div>
    </div>
  </header>

  <div class="app-scroll">
    <ul class="tabs">
      <li class="tab active" onclick="filterAlerts('all', this)">Semua</li>
      <li class="tab" onclick="filterAlerts('unread', this)">Belum dibaca</li>
      <li class="tab" onclick="filterAlerts('critical', this)">Critical</li>
    </ul>

    <div id="alertFeed"><!-- alerts rendered live by sensors-engine --></div>
  </div>

  <div class="spacer-bottom"></div>
  <nav class="bottom-nav">
    <a href="../app.html" class="nav-item"><i class="ph ph-house" data-icon="ph-house"></i><span>Home</span></a>
    <a href="air-quality.html" class="nav-item"><i class="ph ph-wind" data-icon="ph-wind"></i><span>Air</span></a>
    <a href="culture-health.html" class="nav-item fab" aria-label="Culture"><i class="ph-fill ph-circles-three"></i></a>
    <a href="alerts.html" class="nav-item"><i class="ph ph-bell" data-icon="ph-bell"></i><span>Alerts</span></a>
    <a href="settings.html" class="nav-item"><i class="ph ph-gear" data-icon="ph-gear"></i><span>More</span></a>
  </nav>
</div>

<script src="../js/app-shell.js?v=16"></script>
<script src="../js/more-menu.js"></script>
<script src="../js/pwa.js"></script>
<script src="../js/i18n.js?v=16"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/sensors-engine.js"></script>
<script src="../js/history.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/scheduler.js"></script>
<script>
requireAuthPage();
var currentFilter = 'all';

// Render the live alert feed, then re-apply the active filter on every update.
ALCURA.renderAlerts('#alertFeed');
ALCURA.on(function () { applyFilter(); });

function filterAlerts(filter, tab) {
  currentFilter = filter;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  applyFilter();
}
function applyFilter() {
  document.querySelectorAll('#alertFeed .alert').forEach(function (a) {
    var lvl = a.getAttribute('data-level');
    var show = currentFilter === 'all'
      || (currentFilter === 'critical' && lvl === 'critical')
      || (currentFilter === 'unread' && lvl !== 'success');
    a.style.display = show ? 'flex' : 'none';
  });
  var feed = document.getElementById('alertFeed');
  if (feed && !feed.querySelector('.alert[style*="flex"]') && !feed.textContent.trim().length) {
    /* nothing */
  }
}
</script>
</body>
</html>
