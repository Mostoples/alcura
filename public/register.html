<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
<meta charset="UTF-8">
<link rel="shortcut icon" href="img/logo.png" type="image/png">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Daftar — ALCURA</title>
<script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css?v=11">
<link rel="stylesheet" href="css/landing.css?v=11">
</head>
<body>
<div class="liquid-bg">
  <div class="flow flow-a" aria-hidden="true"></div>
  <div class="flow flow-b" aria-hidden="true"></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="culture-cells" aria-hidden="true"></div>
</div>

<button class="auth-theme" onclick="toggleTheme()" aria-label="Ganti tema"><i class="ph ph-moon" data-theme-icon></i></button>

<main class="auth-page">
  <div class="auth-card glass">
    <a class="auth-logo" href="index.html"><span class="mark mark-algae"></span> ALCURA</a>
    <h1>Buat Akun</h1>
    <p class="auth-sub">Gratis selamanya untuk satu unit. Tanpa kartu kredit.</p>

    <div class="auth-msg" id="authMsg" hidden></div>

    <div class="afield">
      <label for="regName">Nama Lengkap</label>
      <div class="ainput"><i class="ph ph-user"></i><input type="text" id="regName" autocomplete="name" placeholder="Theresa Pena"></div>
    </div>
    <div class="afield">
      <label for="regEmail">Email</label>
      <div class="ainput"><i class="ph ph-envelope-simple"></i><input type="email" id="regEmail" autocomplete="email" placeholder="nama@email.com"></div>
    </div>
    <div class="afield">
      <label for="regPassword">Password</label>
      <div class="ainput"><i class="ph ph-lock-simple"></i><input type="password" id="regPassword" autocomplete="new-password" placeholder="Minimal 8 karakter"><i class="ph ph-eye eye" onclick="togglePw('regPassword',this)"></i></div>
    </div>

    <div class="arow"><label><input type="checkbox" id="agreeTerms" checked> Saya setuju dengan Syarat &amp; Privasi</label></div>

    <button class="btn btn-primary btn-block" id="regBtn" type="button" onclick="handleRegister()"><i class="ph ph-leaf"></i> Buat Akun</button>

    <div class="adiv">atau</div>

    <button class="btn btn-block btn-google" type="button" id="regGoogleBtn" onclick="handleGoogleRegister()">
      <svg class="g-logo" viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
      <span>Daftar dengan Google</span>
    </button>

    <p class="auth-foot">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
  </div>
</main>

<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js?v=11"></script>
<script src="js/auth-ui.js"></script>
<script>
(function(){function sync(){var d=document.documentElement.getAttribute('data-theme');document.querySelectorAll('[data-theme-icon]').forEach(function(i){i.className=(d==='dark'?'ph ph-sun':'ph ph-moon');});}var o=window.toggleTheme;window.toggleTheme=function(){if(o)o();sync();};sync();})();

setTimeout(() => { if (typeof alcuraAuth !== 'undefined' && alcuraAuth.isAuthenticated()) { window.location.href = 'app.html'; } }, 500);

function handleRegister() {
  if (!authReady('regBtn')) return;
  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const agreeTerms = document.getElementById('agreeTerms').checked;
  const btn = document.getElementById('regBtn');
  if (!name || !email || !password) { showAuthMsg('Semua field harus diisi.', 'error'); return; }
  if (password.length < 8) { showAuthMsg('Password minimal 8 karakter.', 'error'); return; }
  if (!agreeTerms) { showAuthMsg('Anda harus menyetujui Syarat & Privasi.', 'error'); return; }
  setBtnLoading(btn, 'Membuat akun…'); clearAuthMsg();
  alcuraAuth.createAccount(email, password, name)
    .then(() => { localStorage.setItem('userEmail', email); showAuthMsg('Akun dibuat, mengalihkan…', 'success'); window.location.href = 'app.html'; })
    .catch((error) => { showAuthMsg(friendlyAuthError(error), 'error'); resetBtn(btn); });
}
function handleGoogleRegister() {
  if (!authReady('regGoogleBtn')) return;
  const btn = document.getElementById('regGoogleBtn');
  setBtnLoading(btn, 'Menghubungkan Google…'); clearAuthMsg();
  alcuraAuth.signInWithGoogle()
    .then((user) => { localStorage.setItem('userEmail', user.email); showAuthMsg('Akun siap, mengalihkan…', 'success'); window.location.href = 'app.html'; })
    .catch((error) => { showAuthMsg(friendlyAuthError(error), 'error'); resetBtn(btn); });
}
</script>
</body>
</html>
