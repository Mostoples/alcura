<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar — ALCURA</title>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-sans/style.css" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="bg-grain"></div>

<div class="auth-wrap">
  <aside class="auth-art">
    <div class="brand"><span class="mark"><i class="ph-fill ph-leaf"></i></span> ALCURA</div>
    <div class="quote"><h2>Mulai perjalanan udara hidup Anda.</h2><p>Daftar dalam satu menit, hubungkan unit ALCURA, dan biarkan AI menjaga kultur Anda.</p></div>
    <div class="badges"><div class="b"><i class="ph-fill ph-shield-check"></i> Aman & privat</div><div class="b"><i class="ph-fill ph-device-mobile"></i> Multi-device</div><div class="b"><i class="ph-fill ph-bell"></i> Alert pintar</div></div>
  </aside>
  <div class="auth-form-side">
    <div class="auth-toggle-corner"><div class="theme-toggle" onclick="toggleTheme()"><div class="knob"></div><span class="tt sun"><i class="ph-fill ph-sun"></i></span><span class="tt moon"><i class="ph-fill ph-moon"></i></span></div></div>
    <div class="auth-card">
      <a class="back" href="index.html"><i class="ph ph-arrow-left"></i> Kembali</a>
      <h1>Buat Akun</h1><p class="sub">Gratis selamanya untuk satu unit. Tanpa kartu kredit.</p>
      <div class="field"><label>Nama Lengkap</label><div class="inp"><i class="ph ph-user"></i><input type="text" placeholder="Theresa Pena"></div></div>
      <div class="field"><label>Email</label><div class="inp"><i class="ph ph-envelope-simple"></i><input type="email" placeholder="nama@email.com"></div></div>
      <div class="field"><label>Password</label><div class="inp"><i class="ph ph-lock-simple"></i><input type="password" id="rpw" placeholder="Minimal 8 karakter"><i class="ph ph-eye eye" onclick="togglePw('rpw',this)"></i></div></div>
      <div class="row-between"><label><input type="checkbox" checked> Saya setuju dengan Syarat & Privasi</label></div>
      <button class="btn btn-primary btn-block" onclick="window.location.href='app.html'"><i class="ph ph-leaf"></i> Buat Akun</button>
      <div class="divider">atau daftar dengan</div>
      <div class="social"><button class="s"><i class="ph ph-google-logo"></i> Google</button><button class="s"><i class="ph ph-apple-logo"></i> Apple</button></div>
      <p class="swap">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
