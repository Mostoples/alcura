<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
  <link rel="shortcut icon" href="favicon.svg" type="image/x-icon">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Masuk — ALCURA</title>
<script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="bg-grain"></div>

<button class="btn-icon theme-toggle auth-toggle-corner" onclick="toggleTheme()" aria-label="Ganti tema"><i class="ph ph-moon" data-theme-icon></i></button>

<main class="auth-shell">
  <div class="auth-brand">
    <span class="brand-dot"></span>
    <h1>ALCURA</h1>
    <p>Living Air for Living Spaces</p>
  </div>

  <section class="card aura-green no-pattern" style="padding:28px;display:flex;flex-direction:column;gap:18px">
    <div>
      <h2 class="auth-title">Masuk</h2>
      <p class="auth-sub">Senang melihat Anda lagi. Masuk untuk melanjutkan.</p>
    </div>

    <div class="auth-msg" id="authMsg" hidden></div>

    <div class="form-group"><label class="form-label" for="loginEmail">Email</label><input class="form-input" type="email" id="loginEmail" autocomplete="email" placeholder="nama@email.com"></div>
    <div class="form-group"><label class="form-label" for="loginPassword">Password</label><input class="form-input" type="password" id="loginPassword" autocomplete="current-password" placeholder="••••••••"></div>

    <div class="row-between"><label><input type="checkbox" id="rememberMe" checked> Ingat saya</label><a href="#">Lupa password?</a></div>

    <button class="btn-block primary" id="emailLoginBtn" onclick="handleEmailLogin()"><i class="ph ph-sign-in"></i> Masuk</button>

    <div class="auth-divider">atau</div>

    <button class="btn-block google" type="button" id="googleLoginBtn" onclick="handleGoogleLogin()">
      <svg class="g-logo" viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
      <span>Lanjutkan dengan Google</span>
    </button>
  </section>

  <p class="auth-foot">Belum punya akun? <a href="register.html" class="auth-link">Daftar gratis</a></p>
</main>

<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/auth-ui.js"></script>
<script>
(function(){function sync(){var d=document.documentElement.getAttribute('data-theme');document.querySelectorAll('[data-theme-icon]').forEach(function(i){i.className=(d==='dark'?'ph ph-sun':'ph ph-moon');});}var o=window.toggleTheme;window.toggleTheme=function(){if(o)o();sync();};sync();})();

setTimeout(() => { if (typeof alcuraAuth !== 'undefined' && alcuraAuth.isAuthenticated()) { window.location.href = 'app.html'; } }, 500);

function handleEmailLogin() {
  if (!authReady('emailLoginBtn')) return;
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const btn = document.getElementById('emailLoginBtn');
  if (!email || !password) { showAuthMsg('Email dan password harus diisi.', 'error'); return; }
  setBtnLoading(btn, 'Sedang masuk...'); clearAuthMsg();
  alcuraAuth.signInWithEmail(email, password)
    .then(() => {
      localStorage.setItem('userEmail', email);
      if (document.getElementById('rememberMe').checked) localStorage.setItem('rememberEmail', email);
      else localStorage.removeItem('rememberEmail');
      showAuthMsg('Berhasil masuk, mengalihkan…', 'success');
      window.location.href = 'app.html';
    })
    .catch((error) => { showAuthMsg(friendlyAuthError(error), 'error'); resetBtn(btn); });
}
function handleGoogleLogin() {
  if (!authReady('googleLoginBtn')) return;
  const btn = document.getElementById('googleLoginBtn');
  setBtnLoading(btn, 'Menghubungkan Google…'); clearAuthMsg();
  alcuraAuth.signInWithGoogle()
    .then((user) => { localStorage.setItem('userEmail', user.email); showAuthMsg('Berhasil masuk, mengalihkan…', 'success'); window.location.href = 'app.html'; })
    .catch((error) => { showAuthMsg(friendlyAuthError(error), 'error'); resetBtn(btn); });
}
window.addEventListener('DOMContentLoaded', () => {
  const remembered = localStorage.getItem('rememberEmail');
  if (remembered) document.getElementById('loginEmail').value = remembered;
});
</script>
</body>
</html>
