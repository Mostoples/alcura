<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <link rel="shortcut icon" href="../favicon.svg" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ALCURA AI — Asisten Cerdas</title>
  <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css?v=5">
  <link rel="stylesheet" href="../css/mobile.css?v=5">
  <link rel="stylesheet" href="../css/landing.css?v=5">
  <style>
    .chat-page{display:flex;flex-direction:column;min-height:100dvh}
    /* override .top-bar's space-between so header items sit tight & aligned */
    .chat-top{display:flex;align-items:center;justify-content:flex-start;gap:.6rem;padding-bottom:.6rem}
    .chat-top .back,.chat-top .btn-icon{width:40px;height:40px;margin:0;border-radius:13px;display:grid;place-items:center;background:var(--bg);box-shadow:var(--shadow-raised-sm);color:var(--text);text-decoration:none;flex-shrink:0;font-size:1.15rem;border:0;cursor:pointer}
    .chat-top>*{align-self:center}
    .chat-avatar{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),rgba(var(--aura-leaf),1));color:var(--accent-ink);font-size:1.25rem;box-shadow:0 0 16px rgba(var(--aura-green),.45);flex-shrink:0}
    .chat-id{flex:1;min-width:0;line-height:1.2}
    .chat-id h2{font-size:1rem;margin:0;line-height:1.15;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .chat-id small{font-size:.72rem;color:var(--text-muted);display:flex;align-items:center;gap:.35rem;margin-top:2px}
    .chat-id small .st{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
    .chat-id small .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse 1.6s infinite;flex-shrink:0}

    .chat-messages{flex:1;display:flex;flex-direction:column;gap:.7rem;padding:1rem 0 150px}
    .msg{max-width:84%;padding:.7rem .9rem;border-radius:18px;font-size:.88rem;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;animation:msgIn .3s ease}
    @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .msg.user{align-self:flex-end;background:linear-gradient(135deg,var(--accent),rgba(var(--aura-leaf),1));color:var(--accent-ink);border-bottom-right-radius:6px;box-shadow:0 6px 16px -6px rgba(var(--aura-green),.5)}
    .msg.ai{align-self:flex-start;background:var(--bg);color:var(--text);box-shadow:var(--shadow-raised-sm);border-bottom-left-radius:6px}
    .msg.ai b{color:var(--accent)}
    .msg.err{align-self:flex-start;background:rgba(var(--aura-coral),.12);color:rgb(var(--aura-coral));box-shadow:var(--shadow-raised-sm)}
    .msg-row{display:flex;flex-direction:column;gap:.25rem}
    .typing{align-self:flex-start;display:inline-flex;gap:4px;padding:.85rem 1rem;background:var(--bg);border-radius:18px;box-shadow:var(--shadow-raised-sm)}
    .typing span{width:7px;height:7px;border-radius:50%;background:var(--text-muted);animation:typing 1.2s infinite}
    .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
    @keyframes typing{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

    .chat-welcome{text-align:center;padding:2rem 1rem 1rem;color:var(--text-muted)}
    .chat-welcome .big{width:64px;height:64px;border-radius:20px;margin:0 auto 1rem;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),rgba(var(--aura-leaf),1));color:var(--accent-ink);font-size:2rem;box-shadow:0 0 28px rgba(var(--aura-green),.5)}
    .chat-welcome h3{color:var(--text);font-size:1.1rem;margin-bottom:.4rem}
    .chat-welcome p{font-size:.83rem;max-width:300px;margin:0 auto}
    .chips{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:1.2rem}
    .chip{background:var(--bg);box-shadow:var(--shadow-raised-sm);border:0;color:var(--text);font-size:.78rem;font-weight:600;padding:.55rem .9rem;border-radius:var(--radius-pill);cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:.4rem}
    .chip:hover{box-shadow:var(--shadow-raised),0 0 0 1px rgba(var(--aura-green),.25);color:var(--accent)}
    .chip i{color:var(--accent)}

    .chat-composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:760px;padding:.7rem 16px calc(.9rem + env(safe-area-inset-bottom));
      background:linear-gradient(180deg,transparent,var(--bg) 28%);z-index:40}
    .composer-inner{display:flex;align-items:flex-end;gap:.5rem;background:var(--bg);border-radius:24px;padding:.4rem .4rem .4rem 1rem;box-shadow:var(--shadow-raised),0 0 0 1px rgba(var(--aura-green),.12)}
    .composer-inner textarea{flex:1;border:0;background:transparent;resize:none;font-family:var(--font);font-size:.9rem;color:var(--text);max-height:120px;line-height:1.4;padding:.5rem 0;outline:none}
    .composer-inner textarea::placeholder{color:var(--text-dim)}
    .send-btn{width:42px;height:42px;border-radius:50%;border:0;flex-shrink:0;background:linear-gradient(135deg,var(--accent),rgba(var(--aura-leaf),1));color:var(--accent-ink);font-size:1.2rem;display:grid;place-items:center;cursor:pointer;transition:.2s;box-shadow:0 4px 12px -2px rgba(var(--aura-green),.5)}
    .send-btn:disabled{opacity:.45;cursor:not-allowed}
    .send-btn:not(:disabled):active{transform:scale(.9)}

    /* Desktop: keep the conversation in a comfortable, elegant reading column */
    @media (min-width:1024px){
      .app-container.chat-page{ max-width:860px; }
      .chat-messages{ padding-top:1.4rem; }
      .msg{ max-width:74%; font-size:.92rem; }
      .chat-composer{ max-width:860px; padding-bottom:1.4rem; }
    }
    /* Subtle divider so the header reads as a distinct bar */
    .chat-top{ border-bottom:1px solid var(--line); margin-bottom:.2rem; }
    .msg.ai{ border:1px solid rgba(var(--aura-green),.10); }
    .msg + .msg{ margin-top:0; }
  </style>
</head>
<body>
<div class="liquid-bg">
  <div class="flow flow-a" aria-hidden="true"></div>
  <div class="flow flow-b" aria-hidden="true"></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="culture-cells" aria-hidden="true"></div>
</div>
<div class="app-container chat-page">
  <header class="top-bar chat-top">
    <a href="../app.html" class="back" aria-label="Kembali"><i class="ph ph-arrow-left"></i></a>
    <div class="chat-avatar"><i class="ph-fill ph-sparkle"></i></div>
    <div class="chat-id">
      <h2>ALCURA AI</h2>
      <small><span class="dot"></span><span class="st">Online · ditenagai Gemini</span></small>
    </div>
    <div class="top-bar-actions">
      <button class="btn-icon" onclick="clearChat()" aria-label="Chat baru" title="Chat baru"><i class="ph ph-trash"></i></button>
    </div>
  </header>

  <div class="chat-messages" id="messages">
    <div class="chat-welcome" id="welcome">
      <div class="big"><i class="ph-fill ph-sparkle"></i></div>
      <h3>Halo! Saya ALCURA AI 🌱</h3>
      <p>Tanya apa saja tentang kualitas udara, kesehatan kultur Spirulina, jadwal panen, atau perawatan perangkat Anda.</p>
      <div class="chips" id="chips">
        <button class="chip" onclick="sendSuggestion(this)"><i class="ph ph-wind"></i> Bagaimana kualitas udara saya?</button>
        <button class="chip" onclick="sendSuggestion(this)"><i class="ph ph-plant"></i> Status kultur Spirulina?</button>
        <button class="chip" onclick="sendSuggestion(this)"><i class="ph ph-calendar-check"></i> Kapan waktu panen?</button>
        <button class="chip" onclick="sendSuggestion(this)"><i class="ph ph-flask"></i> Apa itu Spirulina?</button>
      </div>
    </div>
  </div>

  <div class="chat-composer">
    <div class="composer-inner">
      <textarea id="input" rows="1" placeholder="Tulis pesan…" oninput="autosize(this);toggleSend()"></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()" disabled aria-label="Kirim"><i class="ph-fill ph-paper-plane-right"></i></button>
    </div>
  </div>
</div>

<script src="../js/firebase-config.js"></script>
<script src="../js/app-shell.js"></script>
<script src="../js/more-menu.js"></script>
<script src="../js/i18n.js?v=5"></script>
<script src="../js/sensors-engine.js"></script>
<script src="../js/ai-secret.js" onerror="void 0"></script>
<script>
requireAuthPage();

/* ===== AI transport =====
   The Gemini keys live in js/ai-secret.js — a file that is gitignored (never
   pushed to GitHub) but IS deployed to Firebase Hosting. The chat calls Gemini
   directly from the browser and rotates to the next key when one hits its limit. */
var GEMINI_DIRECT = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent';
var DEV_KEYS = Array.isArray(window.ALCURA_AI_DEV_KEYS) ? window.ALCURA_AI_DEV_KEYS.filter(Boolean)
  : (typeof window.ALCURA_AI_DEV_KEY === 'string' && window.ALCURA_AI_DEV_KEY ? [window.ALCURA_AI_DEV_KEY] : []);
var keyIdx = (function () { var n = parseInt(localStorage.getItem('alcuraKeyIdx') || '0', 10); return (n >= 0 && n < DEV_KEYS.length) ? n : 0; })();

var chatHistory = [];           // [{role:'user'|'model', parts:[{text}]}]
var sending = false;
var messagesEl = document.getElementById('messages');
var inputEl = document.getElementById('input');
var sendBtn = document.getElementById('sendBtn');

/* ===== Live sensor context (so the AI knows the real readings) ===== */
function liveContext() {
  if (typeof ALCURA === 'undefined') return '';
  var d = ALCURA.snapshot();
  return [
    'DATA SENSOR REAL-TIME SAAT INI (gunakan untuk menjawab pertanyaan tentang kondisi terkini):',
    '- Skor kualitas udara: ' + d.air.score + '/100 (' + d.air.label + ')',
    '- CO₂: ' + d.air.co2 + ' ppm | TVOC: ' + d.air.tvoc + ' ppb | kelembapan: ' + d.air.rh + '%',
    '- Keamanan gas/asap: tertinggi ' + d.safety.value + ' ppm di ' + d.safety.loc + ' (status: ' + d.safety.level + ')',
    '- Kultur: suhu ' + d.culture.temp + '°C, pH ' + d.culture.ph + ', TDS ' + d.culture.tds + ' ppm, OD ' + d.culture.od + ', klorofil ' + d.culture.chl + '%, status ' + d.culture.status,
    '- Level air: ' + Math.round(d.s.level) + '%',
    '- Prediksi panen: ' + d.harvest.days + ' hari lagi (kesiapan ' + d.harvest.readiness + '%, estimasi ' + d.harvest.yieldG + ' g)',
    '- Aktuator: LED ' + d.applied.ledIntensity + '%, aerasi ' + d.applied.aeration + '%, Auto Mode ' + (d.control.autoMode ? 'aktif' : 'nonaktif'),
    '- Dampak hari ini: CO₂ terserap ' + d.impact.co2Today + ' g, O₂ diproduksi ' + d.impact.o2Today + ' L'
  ].join('\n');
}

function systemPrompt() {
  return 'Kamu adalah ALCURA AI, asisten cerdas di dalam aplikasi ALCURA — sebuah fotobioreaktor Spirulina pintar yang memurnikan udara dalam ruangan dengan menyerap CO₂ dan memproduksi O₂.\n' +
    'Perangkat memiliki sensor: 3× MQ-2 (asap/gas), MG811 (CO₂), ENS160+AHT21 (TVOC/eCO₂/suhu/kelembapan), DHT-11, MLX90614 (suhu kultur non-kontak), pH meter, TDS, HC-SR04 (level air), TCS3200 (warna/klorofil kultur), sensor UV, serta lampu grow LED WS2812B & strip.\n' +
    'Tugasmu: bantu pengguna memahami kualitas udara, kesehatan kultur, jadwal panen, dan perawatan. Jawab ramah, ringkas, dan praktis (gunakan poin bila perlu). Jika ditanya kondisi terkini, gunakan DATA SENSOR di bawah. Jangan mengarang angka di luar data yang diberikan.\n' +
    replyLangInstruction() + '\n\n' +
    liveContext();
}

function replyLangInstruction() {
  var l = (window.ALCURA_I18N && ALCURA_I18N.lang) || 'en';
  if (l === 'id') return 'PENTING: Jawab SELALU dalam Bahasa Indonesia.';
  if (l === 'ja') return 'IMPORTANT: Always reply in Japanese (日本語).';
  return 'IMPORTANT: Always reply in English.';
}

/* ===== UI helpers ===== */
function autosize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }
function toggleSend() { sendBtn.disabled = sending || !inputEl.value.trim(); }
function scrollDown() { requestAnimationFrame(function () { window.scrollTo(0, document.body.scrollHeight); messagesEl.scrollTop = messagesEl.scrollHeight; }); }

function escapeHtml(s) { return s.replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function format(s) {
  s = escapeHtml(s);
  s = s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');           // **bold**
  s = s.replace(/(^|\n)\s*[\*\-]\s+/g, '$1• ');           // bullet lists
  return s.trim();
}

function addMessage(text, who) {
  var w = document.getElementById('welcome'); if (w) w.remove();
  var el = document.createElement('div');
  el.className = 'msg ' + who;
  el.innerHTML = who === 'ai' ? format(text) : escapeHtml(text);
  messagesEl.appendChild(el);
  scrollDown();
  return el;
}
function showTyping() {
  var t = document.createElement('div');
  t.className = 'typing'; t.id = 'typing';
  t.innerHTML = '<span></span><span></span><span></span>';
  messagesEl.appendChild(t); scrollDown();
}
function hideTyping() { var t = document.getElementById('typing'); if (t) t.remove(); }

function sendSuggestion(btn) { inputEl.value = btn.textContent.trim(); toggleSend(); send(); }

function clearChat() {
  chatHistory = [];
  messagesEl.innerHTML = '';
  location.reload();
}

function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

/* Extract text from a raw Gemini response (direct mode) */
function extractDirect(j) {
  var c = j && j.candidates && j.candidates[0];
  var t = c && c.content && c.content.parts && c.content.parts.map(function (p) { return p.text || ''; }).join('');
  if (!t) { var b = j && j.promptFeedback && j.promptFeedback.blockReason; if (b) t = 'Maaf, permintaan tidak dapat diproses (' + b + ').'; }
  return t || '';
}

/* A key is considered exhausted/unusable for these statuses -> rotate to next */
function isKeyLimit(status) { return status === 429 || status === 403 || status === 401 || status === 400; }

/* LOCAL DEV: call Gemini directly, auto-rotating through DEV_KEYS on limit */
function callDirectRotating() {
  var attempts = 0, max = DEV_KEYS.length + 2;
  function once() {
    attempts++;
    var key = DEV_KEYS[keyIdx];
    return fetch(GEMINI_DIRECT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: systemPrompt() }] },
        contents: chatHistory,
        generationConfig: { temperature: 0.7, maxOutputTokens: 2048, topP: 0.95, thinkingConfig: { thinkingBudget: 0 } }
      })
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (r.ok) {
          var t = extractDirect(j);
          if (!t) throw new Error('Maaf, tidak ada jawaban. Coba lagi.');
          localStorage.setItem('alcuraKeyIdx', String(keyIdx)); // remember the working key
          return t;
        }
        if (isKeyLimit(r.status) && attempts < max) {
          keyIdx = (keyIdx + 1) % DEV_KEYS.length;             // ⟳ next key
          localStorage.setItem('alcuraKeyIdx', String(keyIdx));
          return once();
        }
        if (r.status === 503 && attempts < max) return sleep(1200).then(once); // transient
        throw new Error((j.error && j.error.message) || ('Semua API key sedang limit (kode ' + r.status + '). Coba lagi nanti.'));
      });
    });
  }
  return once();
}

/* One reply request */
function requestReply() {
  if (!DEV_KEYS.length) return Promise.reject(new Error('API key belum tersedia (js/ai-secret.js).'));
  return callDirectRotating();
}

function send() {
  var text = inputEl.value.trim();
  if (!text || sending) return;
  addMessage(text, 'user');
  chatHistory.push({ role: 'user', parts: [{ text: text }] });
  inputEl.value = ''; autosize(inputEl);
  sending = true; toggleSend();
  showTyping();

  requestReply()
    .then(function (reply) {
      hideTyping();
      addMessage(reply, 'ai');
      chatHistory.push({ role: 'model', parts: [{ text: reply }] });
    })
    .catch(function (err) {
      hideTyping();
      // Drop the failed user turn so retry doesn't duplicate it in chatHistory
      if (chatHistory.length && chatHistory[chatHistory.length - 1].role === 'user') chatHistory.pop();
      var el = addMessage('⚠ ' + (err.message || 'Terjadi kesalahan.') + '\nPeriksa koneksi internet Anda lalu coba lagi.', 'ai');
      el.classList.remove('ai'); el.classList.add('err');
    })
    .finally(function () { sending = false; toggleSend(); });
}

/* Enter to send (Shift+Enter = newline) */
inputEl.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
</script>
</body>
</html>
