<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <link rel="shortcut icon" href="../favicon.svg" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Controls — ALCURA</title>
  <script>(function(){var t=localStorage.getItem('theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/mobile.css">
</head>
<body>
<div class="app-container">
  <header class="top-bar">
    <div class="page-title-block"><h2>Controls</h2><p>Atur LED, aerasi & mode</p></div>
    <div class="top-bar-actions">
      <button class="btn-icon theme-toggle" onclick="toggleTheme()" aria-label="Ganti tema"><i class="ph ph-moon" data-theme-icon></i></button>
    </div>
  </header>

  <div class="app-scroll">
    <h3 class="section-title">LED & Environment</h3>
    <div class="slider-group">
      <label><span>LED Intensity</span><span id="ledVal">72%</span></label>
      <input type="range" min="0" max="100" value="72" oninput="document.getElementById('ledVal').textContent = this.value + '%'">
    </div>

    <h3 class="section-title">Spectrum Tuning</h3>
    <div class="spectrum-grid">
      <div class="spectrum-item"><label>Red</label><div class="spectrum-swatch" style="background:#ff4444"></div><input type="range" min="0" max="100" value="85"></div>
      <div class="spectrum-item"><label>Blue</label><div class="spectrum-swatch" style="background:#4488ff"></div><input type="range" min="0" max="100" value="60"></div>
      <div class="spectrum-item"><label>Green</label><div class="spectrum-swatch" style="background:#44ff44"></div><input type="range" min="0" max="100" value="45"></div>
      <div class="spectrum-item"><label>Far-Red</label><div class="spectrum-swatch" style="background:#cc3333"></div><input type="range" min="0" max="100" value="30"></div>
      <div class="spectrum-item"><label>UV</label><div class="spectrum-swatch" style="background:#9944ff"></div><input type="range" min="0" max="100" value="15"></div>
    </div>

    <div class="slider-group">
      <label><span>Aeration Rate</span><span id="aerVal">60%</span></label>
      <input type="range" min="0" max="100" value="60" oninput="document.getElementById('aerVal').textContent = this.value + '%'">
    </div>

    <h3 class="section-title">Advanced Settings</h3>
    <div class="card no-pattern aura-green">
      <div class="checkbox" style="border:0;padding:.4rem 0"><input type="checkbox" id="co2" checked><label for="co2">CO₂ Injection</label></div>
      <div style="background:rgba(var(--aura-green),.10);border-radius:var(--radius);padding:.8rem;margin-top:.4rem;font-size:.8rem"><span style="color:var(--text-muted)">Status: <b style="color:var(--accent)">Aktif</b></span></div>
    </div>

    <h3 class="section-title">Mode Preset</h3>
    <div class="btn-group">
      <button class="btn btn-secondary" onclick="setMode('siang', this)"><i class="ph-fill ph-sun"></i> Siang</button>
      <button class="btn btn-secondary" onclick="setMode('malam', this)"><i class="ph-fill ph-moon-stars"></i> Malam</button>
      <button class="btn btn-primary" onclick="setMode('growth', this)"><i class="ph-fill ph-rocket"></i> Growth</button>
    </div>

    <div class="checkbox" style="border:0"><input type="checkbox" id="autoMode" checked><label for="autoMode"><b>Auto Mode (AI Optimized)</b> — Sistem menyesuaikan parameter otomatis.</label></div>

    <button class="btn btn-primary btn-block" onclick="saveSettings()"><i class="ph ph-floppy-disk"></i> Simpan Pengaturan</button>
  </div>

  <div class="spacer-bottom"></div>
  <nav class="bottom-nav">
    <a href="../app.html" class="nav-item"><i class="ph ph-house" data-icon="ph-house"></i><span>Home</span></a>
    <a href="air-quality.html" class="nav-item"><i class="ph ph-wind" data-icon="ph-wind"></i><span>Air</span></a>
    <a href="culture-health.html" class="nav-item fab" aria-label="Culture"><i class="ph-fill ph-plant"></i></a>
    <a href="alerts.html" class="nav-item"><i class="ph ph-bell" data-icon="ph-bell"></i><span>Alerts</span></a>
    <a href="settings.html" class="nav-item"><i class="ph ph-gear" data-icon="ph-gear"></i><span>More</span></a>
  </nav>
</div>

<script src="../js/app-shell.js"></script>
<script>
requireAuthPage();
function setMode(mode, el) {
  localStorage.setItem('controlMode', mode);
  document.querySelectorAll('.btn-group .btn').forEach(b => { b.classList.add('btn-secondary'); b.classList.remove('btn-primary'); });
  if (el) { el.classList.add('btn-primary'); el.classList.remove('btn-secondary'); }
  const label = mode === 'siang' ? 'Siang' : mode === 'malam' ? 'Malam' : 'Growth';
  toast('Mode diubah ke: ' + label);
}
function saveSettings() {
  localStorage.setItem('autoMode', document.getElementById('autoMode').checked);
  toast('Pengaturan tersimpan ✓');
}
</script>
</body>
</html>
