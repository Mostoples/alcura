<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Controls — ALCURA</title>
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-sans/style.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/mobile.css">
</head>
<body>
<div class="app-container">
  <div class="app-header">
    <a href="dashboard.html" style="text-decoration: none; color: var(--ink); display: flex; align-items: center; gap: 0.5rem;">
      <i class="ph ph-arrow-left" style="font-size: 1.1rem;"></i>
      <h1>Controls</h1>
    </a>
    <div class="header-right">
      <button class="icon-btn" onclick="toggleTheme()">
        <i class="ph-fill ph-moon"></i>
      </button>
    </div>
  </div>

  <div class="app-scroll">
    <h3 class="section-title">LED & Environment</h3>

    <div class="slider-group">
      <label>
        <span>LED Intensity</span>
        <span id="ledVal">72%</span>
      </label>
      <input type="range" min="0" max="100" value="72" onchange="document.getElementById('ledVal').textContent = this.value + '%'">
    </div>

    <h3 class="section-title">Spectrum Tuning</h3>
    <div class="spectrum-grid">
      <div class="spectrum-item">
        <label>Red</label>
        <div class="spectrum-swatch" style="background: #ff4444;"></div>
        <input type="range" min="0" max="100" value="85" style="width: 100%; height: 3px;">
      </div>
      <div class="spectrum-item">
        <label>Blue</label>
        <div class="spectrum-swatch" style="background: #4488ff;"></div>
        <input type="range" min="0" max="100" value="60" style="width: 100%; height: 3px;">
      </div>
      <div class="spectrum-item">
        <label>Green</label>
        <div class="spectrum-swatch" style="background: #44ff44;"></div>
        <input type="range" min="0" max="100" value="45" style="width: 100%; height: 3px;">
      </div>
      <div class="spectrum-item">
        <label>Far-Red</label>
        <div class="spectrum-swatch" style="background: #cc3333;"></div>
        <input type="range" min="0" max="100" value="30" style="width: 100%; height: 3px;">
      </div>
      <div class="spectrum-item">
        <label>UV</label>
        <div class="spectrum-swatch" style="background: #9944ff;"></div>
        <input type="range" min="0" max="100" value="15" style="width: 100%; height: 3px;">
      </div>
    </div>

    <div class="slider-group">
      <label>
        <span>Aeration Rate</span>
        <span id="aerVal">60%</span>
      </label>
      <input type="range" min="0" max="100" value="60" onchange="document.getElementById('aerVal').textContent = this.value + '%'">
    </div>

    <h3 class="section-title">Advanced Settings</h3>

    <div class="checkbox">
      <input type="checkbox" id="co2" checked>
      <label for="co2">CO₂ Injection</label>
    </div>

    <div style="background: var(--sky-100); border-radius: var(--r-md); padding: 0.8rem; margin: 0.8rem 0; font-size: 0.8rem;">
      <span style="color: var(--ink-mute);">Status: <b style="color: var(--leaf-500);">Aktif</b></span>
    </div>

    <h3 class="section-title">Mode Preset</h3>
    <div class="btn-group">
      <button class="btn btn-secondary" style="flex: 1;" onclick="setMode('siang')">
        <i class="ph-fill ph-sun"></i> Siang
      </button>
      <button class="btn btn-secondary" style="flex: 1;" onclick="setMode('malam')">
        <i class="ph-fill ph-moon-stars"></i> Malam
      </button>
      <button class="btn btn-secondary" style="flex: 1;" onclick="setMode('growth')">
        <i class="ph-fill ph-rocket"></i> Growth
      </button>
    </div>

    <div class="checkbox" style="margin: 1rem 0;">
      <input type="checkbox" id="autoMode" checked>
      <label for="autoMode"><b>Auto Mode (AI Optimized)</b> — Sistem menyesuaikan parameter otomatis.</label>
    </div>

    <button class="btn btn-primary btn-block" style="margin-bottom: 1rem;" onclick="saveSettings()">
      <i class="ph ph-floppy-disk"></i> Simpan Pengaturan
    </button>
  </div>

  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">
      <i class="ph ph-house"></i>
      <span>Home</span>
    </a>
    <a href="air-quality.html" class="nav-item">
      <i class="ph ph-wind"></i>
      <span>Air</span>
    </a>
    <a href="culture-health.html" class="nav-item">
      <i class="ph ph-plant"></i>
      <span>Culture</span>
    </a>
    <a href="alerts.html" class="nav-item">
      <i class="ph ph-bell"></i>
      <span>Alerts</span>
    </a>
    <a href="settings.html" class="nav-item">
      <i class="ph ph-gear"></i>
      <span>More</span>
    </a>
  </nav>
</div>

<script>
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  const newTheme = current === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', newTheme);
  localStorage.setItem('theme', newTheme);
}

const savedTheme = localStorage.getItem('theme') || 'light';
document.documentElement.setAttribute('data-theme', savedTheme);

// Mode control handlers
function setMode(mode) {
  localStorage.setItem('controlMode', mode);
  alert(`Mode diubah ke: ${mode === 'siang' ? 'Siang' : mode === 'malam' ? 'Malam' : 'Growth'}`);
  console.log('Mode set to:', mode);
}

function saveSettings() {
  const autoMode = document.getElementById('autoMode').checked;
  localStorage.setItem('autoMode', autoMode);
  alert('Pengaturan tersimpan!');
  console.log('Settings saved. Auto mode:', autoMode);
}
</script>
</body>
</html>
