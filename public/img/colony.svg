<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640">
<defs>
<radialGradient id="fade" cx="50%" cy="50%" r="50%">
<stop offset="58%" stop-color="#fff" stop-opacity="1"/>
<stop offset="100%" stop-color="#fff" stop-opacity="0"/>
</radialGradient>
<mask id="m"><rect width="100%" height="100%" fill="url(#fade)"/></mask>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
<feGaussianBlur stdDeviation="0.6"/>
</filter>
<linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#7fdca0"/><stop offset="100%" stop-color="#2e9c5b"/>
</linearGradient>
<linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#56b97c"/><stop offset="100%" stop-color="#1f7a48"/>
</linearGradient>
<linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#b7e9c8"/><stop offset="100%" stop-color="#56b97c"/>
</linearGradient>
</defs>

<!-- Spirulina filaments: open helical coils (springs), simple + modern.
     Each coil is a stack of overlapping ellipses → reads as a 3D spiral. -->
<g mask="url(#m)" fill="none" stroke-linecap="round" filter="url(#soft)">

  <!-- Coil 1 — large -->
  <g transform="rotate(-26 200 285)" stroke="url(#g1)" stroke-width="6.5" opacity="0.55">
    <ellipse cx="200" cy="170" rx="72" ry="30"/>
    <ellipse cx="200" cy="216" rx="72" ry="30"/>
    <ellipse cx="200" cy="262" rx="72" ry="30"/>
    <ellipse cx="200" cy="308" rx="72" ry="30"/>
    <ellipse cx="200" cy="354" rx="72" ry="30"/>
    <ellipse cx="200" cy="400" rx="72" ry="30"/>
  </g>

  <!-- Coil 2 — medium -->
  <g transform="rotate(24 430 215)" stroke="url(#g2)" stroke-width="5.5" opacity="0.5">
    <ellipse cx="430" cy="120" rx="54" ry="24"/>
    <ellipse cx="430" cy="158" rx="54" ry="24"/>
    <ellipse cx="430" cy="196" rx="54" ry="24"/>
    <ellipse cx="430" cy="234" rx="54" ry="24"/>
    <ellipse cx="430" cy="272" rx="54" ry="24"/>
    <ellipse cx="430" cy="310" rx="54" ry="24"/>
  </g>

  <!-- Coil 3 — small -->
  <g transform="rotate(-14 335 420)" stroke="url(#g1)" stroke-width="4.6" opacity="0.5">
    <ellipse cx="335" cy="360" rx="42" ry="18"/>
    <ellipse cx="335" cy="390" rx="42" ry="18"/>
    <ellipse cx="335" cy="420" rx="42" ry="18"/>
    <ellipse cx="335" cy="450" rx="42" ry="18"/>
    <ellipse cx="335" cy="480" rx="42" ry="18"/>
  </g>

  <!-- Coil 4 — accent (mint) -->
  <g transform="rotate(36 120 469)" stroke="url(#g3)" stroke-width="3.8" opacity="0.5">
    <ellipse cx="120" cy="430" rx="32" ry="14"/>
    <ellipse cx="120" cy="456" rx="32" ry="14"/>
    <ellipse cx="120" cy="482" rx="32" ry="14"/>
    <ellipse cx="120" cy="508" rx="32" ry="14"/>
  </g>

  <!-- Coil 5 — top-right accent -->
  <g transform="rotate(-40 520 470)" stroke="url(#g2)" stroke-width="3.6" opacity="0.45">
    <ellipse cx="520" cy="430" rx="30" ry="13"/>
    <ellipse cx="520" cy="454" rx="30" ry="13"/>
    <ellipse cx="520" cy="478" rx="30" ry="13"/>
    <ellipse cx="520" cy="502" rx="30" ry="13"/>
  </g>
</g>

<!-- Sparse free cells (single-cell algae) -->
<g mask="url(#m)" fill="#56b97c">
  <circle cx="300" cy="120" r="4" opacity="0.4"/>
  <circle cx="480" cy="360" r="3.4" opacity="0.38"/>
  <circle cx="150" cy="300" r="3" opacity="0.36"/>
  <circle cx="400" cy="500" r="4.2" opacity="0.4"/>
  <circle cx="250" cy="520" r="3" opacity="0.34"/>
</g>
</svg>
