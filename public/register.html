<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
  <link rel="shortcut icon" href="favicon.svg" type="image/x-icon">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar — ALCURA</title>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/geist@1.3.0/dist/fonts/geist-sans/style.css" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="bg-grain"></div>

<div class="auth-wrap">
  <aside class="auth-art">
    <div class="brand"><span class="mark"><i class="ph-fill ph-leaf"></i></span> ALCURA</div>
    <div class="quote"><h2>Mulai perjalanan udara hidup Anda.</h2><p>Daftar dalam satu menit, hubungkan unit ALCURA, dan biarkan AI menjaga kultur Anda.</p></div>
    <div class="badges"><div class="b"><i class="ph-fill ph-shield-check"></i> Aman & privat</div><div class="b"><i class="ph-fill ph-device-mobile"></i> Multi-device</div><div class="b"><i class="ph-fill ph-bell"></i> Alert pintar</div></div>
  </aside>
  <div class="auth-form-side">
    <div class="auth-toggle-corner"><div class="theme-toggle" onclick="toggleTheme()"><div class="knob"></div><span class="tt sun"><i class="ph-fill ph-sun"></i></span><span class="tt moon"><i class="ph-fill ph-moon"></i></span></div></div>
    <div class="auth-card">
      <a class="back" href="index.html"><i class="ph ph-arrow-left"></i> Kembali</a>
      <h1>Buat Akun</h1><p class="sub">Gratis selamanya untuk satu unit. Tanpa kartu kredit.</p>
      <div class="auth-msg" id="authMsg" hidden></div>
      <div class="field"><label>Nama Lengkap</label><div class="inp"><i class="ph ph-user"></i><input type="text" id="regName" placeholder="Theresa Pena"></div></div>
      <div class="field"><label>Email</label><div class="inp"><i class="ph ph-envelope-simple"></i><input type="email" id="regEmail" placeholder="nama@email.com"></div></div>
      <div class="field"><label>Password</label><div class="inp"><i class="ph ph-lock-simple"></i><input type="password" id="regPassword" placeholder="Minimal 8 karakter"><i class="ph ph-eye eye" onclick="togglePw('regPassword',this)"></i></div></div>
      <div class="row-between"><label><input type="checkbox" id="agreeTerms" checked> Saya setuju dengan Syarat & Privasi</label></div>
      <button class="btn btn-primary btn-block" id="regBtn" onclick="handleRegister()"><i class="ph ph-leaf"></i> Buat Akun</button>
      <div class="divider">atau daftar dengan</div>
      <div class="social"><button class="s" type="button" id="regGoogleBtn" onclick="handleGoogleRegister()"><svg class="g-logo" viewBox="0 0 18 18" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.205c0-.639-.057-1.252-.164-1.841H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg> Google</button></div>
      <p class="swap">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
    </div>
  </div>
</div>

<script src="js/firebase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>

<script src="js/auth-ui.js"></script>
<script>
// Redirect to the app if the user is already signed in
setTimeout(() => {
  if (typeof alcuraAuth !== 'undefined' && alcuraAuth.isAuthenticated()) {
    window.location.href = 'app.html';
  }
}, 500);

// Email registration handler
function handleRegister() {
  if (!authReady('regBtn')) return;

  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const agreeTerms = document.getElementById('agreeTerms').checked;
  const btn = document.getElementById('regBtn');

  if (!name || !email || !password) {
    showAuthMsg('Semua field harus diisi.', 'error');
    return;
  }
  if (password.length < 8) {
    showAuthMsg('Password minimal 8 karakter.', 'error');
    return;
  }
  if (!agreeTerms) {
    showAuthMsg('Anda harus menyetujui Syarat & Privasi.', 'error');
    return;
  }

  setBtnLoading(btn, 'Membuat akun…');
  clearAuthMsg();

  alcuraAuth.createAccount(email, password, name)
    .then(() => {
      localStorage.setItem('userEmail', email);
      showAuthMsg('Akun dibuat, mengalihkan…', 'success');
      window.location.href = 'app.html';
    })
    .catch((error) => {
      showAuthMsg(friendlyAuthError(error), 'error');
      resetBtn(btn);
    });
}

// Google registration handler
function handleGoogleRegister() {
  if (!authReady('regGoogleBtn')) return;

  const btn = document.getElementById('regGoogleBtn');
  setBtnLoading(btn, 'Menghubungkan Google…');
  clearAuthMsg();

  alcuraAuth.signInWithGoogle()
    .then((user) => {
      localStorage.setItem('userEmail', user.email);
      showAuthMsg('Akun siap, mengalihkan…', 'success');
      window.location.href = 'app.html';
    })
    .catch((error) => {
      showAuthMsg(friendlyAuthError(error), 'error');
      resetBtn(btn);
    });
}
</script>
</body>
</html>
